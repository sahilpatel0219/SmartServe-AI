# Render Blueprint — deploys the Django backend as a web service.
# Usage: Render dashboard → New → Blueprint → point at this repo.
# MongoDB is NOT provisioned here (Render doesn't host Mongo) — keep using
# your existing MongoDB Atlas cluster and set MONGO_URI below.
#
# After the first deploy, go to the service's Environment tab and fill in
# CORS_ALLOWED_ORIGINS / CSRF_TRUSTED_ORIGINS with your actual Vercel URL,
# and MONGO_URI with your Atlas connection string (marked sync: false below
# so Render doesn't overwrite it and it isn't committed to the repo).

services:
  - type: web
    name: smartserve-api
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn smartserve.wsgi:application --bind 0.0.0.0:$PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: ".onrender.com"
      - key: CORS_ALLOWED_ORIGINS
        value: "https://your-app.vercel.app"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: DB_ENGINE
        value: django.db.backends.postgresql
      - key: DB_NAME
        fromDatabase:
          name: smartserve-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: smartserve-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: smartserve-db
          property: password
      - key: DB_HOST
        fromDatabase:
          name: smartserve-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: smartserve-db
          property: port
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB_NAME
        value: smartserve_db
      - key: LLM_PROVIDER
        value: ""
      - key: LLM_API_KEY
        sync: false

databases:
  # Relational DB for accounts/roles/subscriptions — SQLite has no persistent
  # disk on Render's free web service, so this is required in production
  # (MongoDB continues to hold all operational business data, unchanged).
  - name: smartserve-db
    plan: free
    databaseName: smartserve
    user: smartserve
